# Select "point" for geometric 3D A* plus time parameterization,
# or "kinodynamic" for position-velocity A* using acceleration controls.
planner_mode = kinodynamic

output_directory = output

world_min = 0, 0, 0
world_max = 20, 20, 12
start = 1, 1, 1
goal = 19, 18, 10

grid_resolution = 0.5
safety_margin = 0.4
collision_check_step = 0.125

maximum_velocity = 3.0
maximum_axis_acceleration = 1.0
planning_time_step = 1.0
trajectory_time_step = 0.05
velocity_resolution = 1.0
goal_position_tolerance = 0.75
goal_velocity_tolerance = 0.01
heuristic_weight = 1.5
maximum_expansions = 500000

# Axis-aligned boxes: min_x, min_y, min_z, max_x, max_y, max_z
obstacle = 4, 2, 0, 7, 11, 7
obstacle = 9, 9, 3, 13, 13, 12
obstacle = 14, 3, 0, 17, 8, 8
obstacle = 2, 14, 0, 6, 17, 6
